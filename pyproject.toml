[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mixem"
version = "1.0.0"
description = "Gaussian mixture models from first principles: EM with four covariance types, variational Bayes, model selection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mixem = "mixem.__main__:main"

[tool.setuptools]
packages = ["mixem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
